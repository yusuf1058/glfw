

name: Build App

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build iOS & Android
    runs-on: macos-latest  # Required for iOS

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Build iOS IPA
        run: |
          cd ios
          pod install
          cd ..
          xcodebuild -workspace ios/SocialEnergyTracker.xcworkspace \
            -scheme SocialEnergyTracker \
            -configuration Release \
            -archivePath build/archive \
            archive

      - name: Build Android AAB
        run: |
          cd android
          ./gradlew bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab ../build/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          path: |
            build/archive.xcarchive
            build/app-release.aab
